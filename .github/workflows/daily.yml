name: daily-scan

# ⚠️ 本文件负责「写 K 线」的正式数据入库，由 GitHub 原生 schedule 密集触发，
#    不依赖 WorkBuddy / 本机 / 个人 PAT。落进 15:00-20:00 窗口且数据到位才写盘。
#    夜盘 23:10 那班在 night.yml，只读 + 只推，绝不进这个 job。
#    原因：这个 job 会写 state.json、清空重建 dist/data、并 git push。
#    夜盘 21:00-23:00 是半截行情且属于【下一交易日】，一旦走这条路，
#    日线图与账本就被永久污染。改 cron 前请先看 daily.py / data_build.py
#    开头的 nightgate 闸门说明。
#
# v27.3 定时策略（2026-11-11）—— 更新完全由 GitHub 原生 schedule 驱动
# ─────────────────────────────────────────────────────────────────────────
# 设计原则：更新不依赖 WorkBuddy、不依赖本机开机、不依赖个人 PAT。
#   · 推送用仓库自带的 GITHUB_TOKEN（permissions: contents: write），
#     schedule 触发的运行自带该权限，无需任何外部凭据。
#   · GitHub Actions 的 schedule 在本仓库实测每天延迟 6~10 小时，因此单点 cron
#     必然被推到窗口外。解法：用「密集 cron 网格」保证无论延迟多少，
#     必有班次实际落进北京时间 15:00-20:00 的正式写盘窗口。
#   · 数学：cron 排 UTC 00/02/04/06/08/10/12（北京时间 08-20），延迟 D∈[6,10]h
#     后实际触发 = 北京时间 14-24，对任一 D 都至少覆盖 15:00-20:00 一段。
#   · 落进窗口且 7 品种当日日线到位才写盘；其余班次由 fresh_guard 在约 20 秒内
#     绿色跳过（不联网、不写文件、不报失败）。当天已写过则幂等跳过。
#   · 夜间兜底 21:00/22:00（UTC 13/14）：fresh_guard 在 20:00-23:00 自动进入
#     late 模式，抓取「当日日线在 20:00 后才放出」的尾单；23:00 后仍拒绝。
#   · workflow_dispatch / repository_dispatch 保留作手动/外部兜底（GitHub 网页
#     按钮即可触发，无需 PAT）。
on:
  schedule:
    # 主网格：每 2 小时一次，UTC 00,02,04,06,08,10,12（周一~周五）。
    # 延迟 6~10h 后必落进 15:00-20:00；不在窗口的班次由守卫安全跳过。
    - cron: '0 0,2,4,6,8,10,12 * * 1-5'
    # 夜间尾单兜底：北京时间 21:00 / 22:00（UTC 13/14）。
    # GUARD 自动 late 模式，只抓当日日线延迟放出的尾单，不写夜盘半截行情。
    - cron: '0 13,14 * * 1-5'
  repository_dispatch:          # 外部定时器（cron-job.org / 云函数 / 本机计划任务）
    types: [daily-scan]
  workflow_dispatch:            # 手动触发；force=1 可在白天补数（夜间仍被 nightgate 拒绝）
    inputs:
      force:
        description: '补数模式：1=跳过时间窗口预检（夜盘 20:00-08:00 仍被 nightgate 拦截）'
        type: choice
        options: ['0', '1']
        default: '0'

permissions:
  contents: write

concurrency:
  group: daily-scan
  # v27.2：同一时间只允许一个写盘班次；后来的排队等待，不打断正在写 state.json 的班次。
  # 排队到手的班次会被 fresh_guard 的 already_fresh 判定跳过，因此不会重复写盘/重复推微信。
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-24.04       # v27.2：锁定镜像，避开 ubuntu-latest → Ubuntu 26 迁移
    timeout-minutes: 45         # 预留 fresh_guard 最多 5 轮 × 4 分钟重试
    env:
      PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
      GUARD_MAX_TRY: '5'
      GUARD_RETRY_SEC: '240'
      GUARD_FORCE: ${{ github.event.inputs.force || github.event.client_payload.force || '0' }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 准备配置（凭据不入库）
        run: cp config.ci.json config.json

      # 决策步骤：只读预检 + 输出 proceed=1/0。迟到/数据未到位时本步骤 exit 0，
      # 但后续所有写盘步骤都会被 if 跳过 —— 不再有红叉和失败邮件，也不写脏数据。
      - name: 数据新鲜度守卫（取数自愈 + 班次闸门）
        id: guard
        run: python fresh_guard.py

      - name: 扫描信号
        if: steps.guard.outputs.proceed == '1'
        env:
          # v28：late 班次（20:00-23:00）必须显式带 late，否则 daily.py 会被
          # nightgate 在夜盘窗口直接 exit 3 —— 21:00/22:00 兜底班次过去必挂的原因。
          RUN_MODE: ${{ steps.guard.outputs.run_mode }}
        run: python daily.py

      - name: 重建数据包
        if: steps.guard.outputs.proceed == '1'
        env:
          RUN_MODE: ${{ steps.guard.outputs.run_mode }}
        run: python data_build.py

      - name: 渲染页面
        if: steps.guard.outputs.proceed == '1'
        run: |
          python render.py
          # GitHub Pages 的站点根：页面 + 图表库 + 数据包
          rm -rf data
          cp -r dist/data data
          cp dist/echarts.min.js echarts.min.js
          touch .nojekyll

      # 产物一致性（7 品种末根 / 当日日线 / data 与 dist/data / 页面与数据包 /
      # 策略口径 / built）。不通过就阻断「提交更新」，绝不推残缺数据上线。
      - name: 产物一致性校验
        if: steps.guard.outputs.proceed == '1'
        run: python fresh_guard.py --verify

      - name: 生成每日极简日志
        if: steps.guard.outputs.proceed == '1'
        run: python daily_log.py

      - name: 校验数据新鲜度
        if: steps.guard.outputs.proceed == '1'
        run: |
          python - <<'PY'
          import json, os, datetime
          codes = ('MA', 'HC', 'Y', 'SM', 'FG', 'P', 'M')
          last, missing = None, []
          for c in codes:
              p = 'dist/data/%s.json' % c
              if not os.path.exists(p):
                  missing.append(c)
                  continue
              b = json.load(open(p, encoding='utf-8'))['main'][-1][0]
              last = max(last, b) if last else b
          today = datetime.datetime.now(
              datetime.timezone(datetime.timedelta(hours=8))).date().isoformat()
          print('latest bar:', last, '| 北京时间:', today, '| 缺文件:', missing or '无')
          if last and last < today:
              print('WARNING: 数据未到当日，可能接口延迟或抓取失败')
          PY

      # v11.1：微信推送统一由 daily.py 完成（品种白名单 + 进场/出场/离场/趋势四类），
      # 不再调用 notify.py，避免同一条信号重复发两遍。
      - name: 提交更新
        if: steps.guard.outputs.proceed == '1'
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A state.json index.html dist/ data/ echarts.min.js .nojekyll logs/ LIVE_LOG.md daily_log.py
          git diff --cached --quiet || git commit -m "scan $(date -u +%F-%H:%M) [skip ci]"
          git push

      - name: 本班跳过说明
        if: steps.guard.outputs.proceed != '1'
        run: |
          echo "::notice::本班未写盘：${{ steps.guard.outputs.skip_reason }}"
          echo "原因：本班实际触发时间落在 15:00-20:00 窗口外（GitHub schedule 延迟），"
          echo "      或当日日线尚未由数据源放出。"
          echo "处理：密集 cron 网格保证后续必有班次落进窗口；落进窗口且数据到位即自动写盘。"
          echo "      本班不产生任何文件改动。"
