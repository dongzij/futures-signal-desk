name: daily-scan

# ⚠️ 本文件只负责「写 K 线」的两班（北京时间 15:20 / 15:50）。
#    夜盘 23:10 那班在 night.yml，只读 + 只推，绝不进这个 job。
#    原因：这个 job 会写 state.json、清空重建 dist/data、并 git push。
#    夜盘 21:00-23:00 是半截行情且属于【下一交易日】，一旦走这条路，
#    日线图与账本就被永久污染。改 cron 前请先看 daily.py / data_build.py
#    开头的 nightgate 闸门说明。
#
# v27.1 自愈：fresh_guard.py 在写盘【之前】只读预检行情源，取不到当日完整日线
#   就等 4 分钟重取（最多 5 轮）；渲染之后再用 --verify 校验产物一致性，
#   不通过就阻断「提交更新」。整体超时放到 45 分钟，容纳重试窗口。
#   job 外部若整班没触发，由 guard.yml / guard_watch.py 补派发。
on:
  schedule:
    # 1. 全天正式数据入库（北京时间 15:20）—— 计入 K 线，更新所有账本
    - cron: '20 7 * * 1-5'
    # 2. 兜底重试（北京时间 15:50）—— 计入 K 线
    - cron: '50 7 * * 1-5'
  workflow_dispatch:      # 保留手动触发按钮（白天补数用，夜间会被闸门拒绝）

permissions:
  contents: write

concurrency:
  group: daily-scan
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 45          # v27.1：预留 fresh_guard 最多 5 轮 × 4 分钟重试
    env:
      PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
      GUARD_MAX_TRY: '5'
      GUARD_RETRY_SEC: '240'      # 4 分钟，落在用户要求的 3~5 分钟区间
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 准备配置（凭据不入库）
        run: cp config.ci.json config.json

      # v27.1：只读预检。失败时按 4 分钟间隔自愈重取，最多 5 轮；
      # 绝不把 daily.py / data_build.py 放进重试循环（会重复写 state、重复推微信）。
      - name: 数据新鲜度守卫（取数自愈）
        run: python fresh_guard.py

      - name: 扫描信号
        run: python daily.py

      - name: 重建数据包
        run: python data_build.py

      - name: 渲染页面
        run: |
          python render.py
          # GitHub Pages 的站点根：页面 + 图表库 + 数据包
          rm -rf data
          cp -r dist/data data
          cp dist/echarts.min.js echarts.min.js
          touch .nojekyll

      # v27.1：产物一致性（7 品种末根 / data 与 dist/data / 页面与数据包 / 策略口径 / built）。
      # 不一致就阻断提交，由 guard.yml 下一轮派发补跑，绝不推残缺数据上线。
      - name: 产物一致性校验
        run: python fresh_guard.py --verify

      # v17：静默观察期 —— 扫描后生成当天极简日志（只记录，不改任何交易逻辑）
      - name: 生成每日极简日志
        run: python daily_log.py

      - name: 校验数据新鲜度
        run: |
          python - <<'PY'
          import json, os, datetime
          # v27.1：品种池必须与当前 7 品种一致。旧版读的 RB/UR/JD 已在 v25
          # 清理历史垃圾时从仓库删除；继续读会抛 FileNotFoundError，
          # 让本步骤失败、后面的「提交更新」根本不执行（数据就永远不更新）。
          codes = ('MA', 'HC', 'Y', 'SM', 'FG', 'P', 'M')
          last, missing = None, []
          for c in codes:
              p = 'dist/data/%s.json' % c
              if not os.path.exists(p):
                  missing.append(c)
                  continue
              b = json.load(open(p, encoding='utf-8'))['main'][-1][0]
              last = max(last, b) if last else b
          today = datetime.datetime.now(
              datetime.timezone(datetime.timedelta(hours=8))).date().isoformat()
          print('latest bar:', last, '| 北京时间:', today, '| 缺文件:', missing or '无')
          if last and last < today:
              print('WARNING: 数据未到当日，可能接口延迟或抓取失败')
          PY

      # v11.1：微信推送统一由 daily.py 完成（品种白名单 + 进场/出场/离场/趋势四类），
      # 不再调用 notify.py，避免同一条信号重复发两遍。

      - name: 提交更新
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A state.json index.html dist/ data/ echarts.min.js .nojekyll logs/ LIVE_LOG.md daily_log.py
          git diff --cached --quiet || git commit -m "scan $(date -u +%F-%H:%M) [skip ci]"
          git push
