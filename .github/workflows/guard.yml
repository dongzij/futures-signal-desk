name: data-watchdog

# v27.1 数据更新自愈：处理「GitHub schedule 整个班次没触发 / 延迟 / 漏跑」。
# 只做只读检查 + 派发正式班次，绝不自己写 state.json / data/ / dist/。
# 与 daily.yml 的关系：daily.yml 内部由 fresh_guard.py 做 3~5 分钟取数重试；
# 本 workflow 负责 job 外部的补触发，两者合起来覆盖「没取到 / 没触发 / 不一致」。
#
# 北京时间对照（cron 为 UTC，实测延迟 +7.6~9.6 小时）：
#   UTC 00:07 → 北京 08:07 + 延迟 = 15:40~17:40
#   UTC 02:07 → 10:07 + 延迟 = 17:40~19:40
#   UTC 04:07 → 12:07 + 延迟 = 19:40~21:40（>20:00 时只 warning 不派发）
#   UTC 01:29 / 03:29 / 05:29 同上再铺一层
# v28.1：分钟数全部错峰（不取 :00 / :30），避开 GitHub 整点拥堵导致的整班丢弃；
# 今天 2026-11-11 九个 :00 班次一个都没触发，就是踩了这个坑。
on:
  schedule:
    - cron: '07 0,2,4 * * 1-5'
    - cron: '29 1,3,5 * * 1-5'
  repository_dispatch:         # v27.2：外部精确定时器（data-watchdog）
    types: [data-watchdog]
  workflow_dispatch:          # 想立刻检查一次线上数据是否到位

permissions:
  contents: read
  actions: write              # 允许派发 daily.yml

concurrency:
  group: data-watchdog
  cancel-in-progress: true

jobs:
  watch:
    runs-on: ubuntu-24.04      # v27.2：锁定镜像
    timeout-minutes: 12
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 检查线上数据新鲜度，必要时派发正式班次
        run: python guard_watch.py

      # v29：收盘终检。只由外部定时器（cron-job.org 20:30）以 mode=final 触发，
      # GitHub schedule 的迟到班次不推送，避免一天重复几次打扰。
      # 达标静默；built 没刷新 / 7 品种末根不齐 → 推一条运维微信（用户 2026-11-12 要求）。
      - name: 收盘终检（北京 20:20 后）· 不达标推微信
        if: github.event_name == 'repository_dispatch' && github.event.client_payload.mode == 'final'
        env:
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python ops_alert.py --final

      - name: 确认没有污染正式数据
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::watchdog 只读，却产生了文件改动，立即中止"; git status --porcelain; exit 1
          fi
          echo "✔ 零改动"
